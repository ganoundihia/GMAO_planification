function renderRetourSection(reportId, isResponsable){
  const rounds = roundsFor(reportId);
  const canAddNewRound = isResponsable && rounds.length < MAX_ROUNDS;
  const lastRoundNum = rounds.length ? rounds[rounds.length-1].round : 0;

  const roundCards = rounds.map(rnd=>{
    const isCurrent = rnd.round === lastRoundNum;
    const canEditThisRound = isResponsable && isCurrent;
    const body = canEditThisRound
      ? retourRoundFormFields(rnd.round, rnd.texte) + `
        <div style="margin-top:8px;">
          <button class="btn btn-primary" data-saveretourround="${rnd.round}">${rnd.texte ? "Mettre à jour ce retour" : "Enregistrer ce retour"}</button>
        </div>
        <div class="hint">Les fichiers sélectionnés sont joints automatiquement en cliquant sur « Enregistrer ».</div>
      `
      : `<div class="readonly-text ${rnd.texte ? "" : "empty"}">${rnd.texte ? escapeHtml(rnd.texte) : "—"}</div>`;

    let responseSection = "";
    if (isCurrent){
      const nbConcerned = DOMAINES.filter(d=>{ const rm=remarkFor(reportId,d.id); return rm && rm.texte && rm.texte.trim(); }).length;
      const nbRepondu = DOMAINES.filter(d=>{
        const rm=remarkFor(reportId,d.id);
        if (!rm || !rm.texte || !rm.texte.trim()) return false;
        const resp = retourReponseFor(reportId, d.id, rnd.round);
        return resp && resp.statutRetour && resp.statutRetour !== "en_attente";
      }).length;
      const respText = rnd.syntheseReponse || "";
      const synthStatut = rnd.syntheseStatut || "brouillon";
      const synthBadge = {
        brouillon: `<span class="badge new">Brouillon</span>`,
        valide: `<span class="badge validated">✓ Validée par le responsable</span>`,
        envoye: `<span class="badge sent">📤 Envoyée à l'UO</span>`
      }[synthStatut];
      const synthLocked = synthStatut !== "brouillon";
      let synthActions = "";
      if (isResponsable){
        synthActions = `
          <div style="margin-bottom:8px;">
            <button class="btn btn-outline" data-genretoursynth="${rnd.round}" ${synthLocked ? "disabled" : ""}>🔄 Générer la réponse (${nbRepondu}/${nbConcerned} systèmes traités)</button>
          </div>
          <textarea id="retourSynthText-${rnd.round}" style="min-height:110px;" ${synthLocked ? "readonly" : ""}>${escapeHtml(respText)}</textarea>
          <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
            ${!synthLocked ? `<button class="btn btn-outline" data-saveretoursynth="${rnd.round}">Enregistrer brouillon</button>` : ""}
            ${!synthLocked ? `<button class="btn btn-primary" data-validateretoursynth="${rnd.round}">Valider la réponse</button>` : ""}
            ${synthStatut === "valide" ? `<button class="btn btn-outline" data-sendretoursynth="${rnd.round}">Envoyer à l'UO</button>` : ""}
            ${synthStatut !== "brouillon" ? `<button class="btn btn-ghost" data-reopenretoursynth="${rnd.round}">↺ Rouvrir</button>` : ""}
            <button class="btn btn-outline" data-copyretoursynth="${rnd.round}">📋 Copier pour email</button>
          </div>
        `;
      }
      responseSection = `
        <div class="retour-sub" style="margin-top:14px;">
          <div class="dh" style="margin-bottom:6px;">
            <span class="name" style="font-size:12.5px;">📤 Synthèse de réponse à l'UO ${rnd.syntheseReponseDate ? "· générée le "+fmtDate(rnd.syntheseReponseDate) : ""}</span>
            ${synthBadge}
          </div>
          ${rnd.syntheseDateValidation ? `<div class="hint" style="margin:0 0 8px;">Validée par ${escapeHtml(rnd.syntheseValidePar||"")} le ${fmtDate(rnd.syntheseDateValidation)}${rnd.syntheseDateEnvoi ? " · envoyée le "+fmtDate(rnd.syntheseDateEnvoi) : ""}</div>` : ""}
          ${isResponsable ? synthActions : `
            <div class="readonly-text ${respText ? "" : "empty"}">${respText ? escapeHtml(respText) : "Pas encore de synthèse de réponse."}</div>
          `}
          <div class="hint">Compile les positions (Validé / En cours + commentaire) de chaque ingénieur pour ce round, à renvoyer à l'UO. Le responsable doit valider la réponse avant de l'envoyer à l'UO.</div>
        </div>
      `;
    }

    return `
      <div class="retour-block" style="${rnd.round>1?"margin-top:14px;":""}${isCurrent?"":"opacity:.88;"}">
        <h4>📥 Retour UO ${rounds.length>1 ? "— Round "+rnd.round+" " : ""}${isCurrent?"(en cours)":"(historique)"} · reçu le ${fmtDate(rnd.dateRetour)} (${rnd.auteur})</h4>
        ${body}
        ${retourAttListMarkup(reportId, rnd.round, isResponsable)}
        ${responseSection}
      </div>
    `;
  }).join("");

  let extra = "";
  if (canAddNewRound){
    extra = `
      <div class="retour-block" style="${rounds.length?"margin-top:14px;":""}border-style:dashed;">
        <h4>➕ Nouveau retour UO ${rounds.length ? "(Round "+(rounds.length+1)+")" : ""}</h4>
        ${retourRoundFormFields("new", "")}
        <div style="margin-top:8px;">
          <button class="btn btn-primary" id="btnSaveNewRound">${rounds.length ? "Enregistrer ce nouveau retour" : "Enregistrer le retour UO"}</button>
        </div>
      </div>
    `;
  } else if (rounds.length === 0){
    extra = `<div class="retour-block"><h4>📥 Retour de l'UO</h4><div class="readonly-text empty">Pas encore de retour de l'UO.</div></div>`;
  } else if (rounds.length >= MAX_ROUNDS && isResponsable){
    extra = `<div class="hint" style="margin-top:10px;">Nombre maximum de retours UO atteint (${MAX_ROUNDS}).</div>`;
  }

  return roundCards + extra;
}

/* Historique des positions (Validé / En cours) d'un ingénieur pour un système,
   à travers tous les rounds de retour UO existants. */
function buildRetourSubBlocks(reportId, dom, rm, canEditDomain){
  const rounds = roundsFor(reportId);
  if (!rounds.length || !rm || !rm.texte || !rm.texte.trim()) return "";
  const lastRoundNum = rounds[rounds.length-1].round;
  return rounds.map(rnd=>{
    const resp = retourReponseFor(reportId, dom.id, rnd.round);
    const statutRetour = resp ? (resp.statutRetour || "en_attente") : "en_attente";
    const rtagLabel = {valide:"✅ Validé", encours:"🔄 En cours", en_attente:"En attente de votre position"}[statutRetour];
    const isCurrent = rnd.round === lastRoundNum;
    const locked = statutRetour === "valide";
    const roundLabel = rounds.length > 1 ? `Round ${rnd.round}` : "Suite au retour UO";
    if (canEditDomain && isCurrent && !locked){
      return `
        <div class="retour-sub">
          <div class="dh" style="margin-bottom:6px;">
            <span class="name" style="font-size:12px;">${roundLabel}</span>
            <span class="rtag ${statutRetour}">${rtagLabel}</span>
          </div>
          <select id="rstatut-${dom.id}-${rnd.round}" style="margin-bottom:8px;">
            <option value="en_attente" ${statutRetour==="en_attente"?"selected":""}>En attente</option>
            <option value="encours" ${statutRetour==="encours"?"selected":""}>En cours (je justifie)</option>
            <option value="valide" ${statutRetour==="valide"?"selected":""}>Validé (je suis d'accord)</option>
          </select>
          <textarea id="rcomment-${dom.id}-${rnd.round}" placeholder="Votre justification ou votre accord sur ce retour...">${resp ? (resp.commentaire||"") : ""}</textarea>
          <div class="hint" style="margin:6px 0 0;">⚠️ Une fois « Validé » enregistré, cette position est verrouillée.</div>
          <div style="margin-top:8px;text-align:right;">
            <button class="btn btn-primary" data-saveretour="${dom.id}" data-round="${rnd.round}">Enregistrer votre position</button>
          </div>
        </div>
      `;
    }
    return `
      <div class="retour-sub">
        <div class="dh" style="margin-bottom:4px;">
          <span class="name" style="font-size:12px;">${roundLabel}${locked?" (verrouillé)":""}</span>
          <span class="rtag ${statutRetour}">${rtagLabel}</span>
        </div>
        <div class="readonly-text ${resp && resp.commentaire ? "" : "empty"}">${resp && resp.commentaire ? escapeHtml(resp.commentaire) : "Pas encore de commentaire."}</div>
      </div>
    `;
  }).join("");
}

        <button class="btn btn-primary" id="btnValidate">Valider la consolidation</button>
        ${statutConsol==="valide" || statutConsol==="envoye" ? `<button class="btn btn-outline" id="btnMarkSent">Marquer comme envoyé à l'UO</button>` : ""}
        ${statutConsol!=="brouillon" ? `<button class="btn btn-ghost" id="btnReopen">↺ Rouvrir</button>` : ""}
      </div>
    `;
  }

  const canUploadAtt = role.type !== "directeur";
  const canDeleteReport = role.type === "responsable";
  const tInfo = getTraitementInfo(report);

  dlg.innerHTML = `
    <div class="dlg-head">
      <div>
        <h3>${report.uo} — ${fmtPeriode(report.periode, report.type)} ${report.titre ? "· "+escapeHtml(report.titre) : ""}</h3>
        <div class="meta">
          <span class="type-tag">${reportTypeObj(report.type||"mensuel").label}</span> ·
          Reçu le ${fmtDate(report.dateReception)} ·
          <span class="badge ${st.cls}">${st.label}</span> ·
          ${envoiBadge(getEnvoiInfo(report))}
          ${traitementBadge(tInfo)}
          ${totalErreurs(reportId) > 0 ? `· <span class="badge" style="background:var(--red-soft);color:var(--red);">${totalErreurs(reportId)} erreur${totalErreurs(reportId)>1?"s":""} au total</span>` : ""}
        </div>
      </div>
      <button class="close-x" id="closeReport">✕</button>
    </div>
    <div class="dlg-body">
      ${renderRetardJustification(report, consol, tInfo, isResponsable)}
      ${renderAttachmentsSection(reportId, canUploadAtt)}
      ${domainBlocks}
      <div class="synth-box">
        <h4>Synthèse consolidée ${consol && consol.dateValidation ? "· validée le "+fmtDate(consol.dateValidation) : ""} ${consol && consol.dateEnvoi ? "· envoyée le "+fmtDate(consol.dateEnvoi) : ""}</h4>
        ${isResponsable
          ? `<textarea id="synthText" style="min-height:140px;">${synthTexte}</textarea>`
          : `<div class="readonly-text ${synthTexte?"":"empty"}">${synthTexte ? escapeHtml(synthTexte) : "Consolidation pas encore rédigée."}</div>`
        }
        ${synthActions}
        <div class="hint">Cliquez sur « Générer la synthèse » pour compiler automatiquement les remarques déjà saisies par les 4 ingénieurs (tous systèmes) en un seul rapport. Vous pouvez ensuite le modifier librement avant validation.</div>
      </div>
      ${renderRetourSection(reportId, isResponsable)}
    </div>
    <div class="dlg-foot">
      ${canDeleteReport ? `<button class="btn btn-outline" style="color:var(--red);margin-right:auto;" id="btnDeleteReport">🗑 Supprimer ce rapport</button>` : ""}
      <button class="btn btn-outline" id="btnCopy">📋 Copier pour email</button>
      <button class="btn btn-outline" id="closeReport2">Fermer</button>
    </div>
  `;

  dlg.querySelector("#closeReport").addEventListener("click", ()=>dlg.close());
  dlg.querySelector("#closeReport2").addEventListener("click", ()=>dlg.close());
  const btnDel = dlg.querySelector("#btnDeleteReport");
  if (btnDel) btnDel.addEventListener("click", async ()=>{
    await deleteReport(reportId);
    if (!state.reports.find(r=>r.id===reportId)) dlg.close();
  });

  const btnSaveRetardJustif = dlg.querySelector("#btnSaveRetardJustif");
  if (btnSaveRetardJustif) btnSaveRetardJustif.addEventListener("click", async ()=>{
    const cause = dlg.querySelector("#retardCause").value;
    const commentaire = dlg.querySelector("#retardCommentaire").value;
    if (!cause){ alert("Merci de sélectionner la cause du retard (équipe DG ou unité opérationnelle)."); return; }
    btnSaveRetardJustif.disabled = true; btnSaveRetardJustif.textContent = "Enregistrement...";
    await saveRetardJustification(reportId, cause, commentaire);
    openReportDialog(reportId);
  });

  // Ouverture / téléchargement / suppression des pièces jointes
  dlg.querySelectorAll("[data-openatt]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const att = state.attachments.find(a=>a.id===btn.dataset.openatt);
      if (att) openAttachment(att);
    });
  });
  dlg.querySelectorAll("[data-dlatt]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const att = state.attachments.find(a=>a.id===btn.dataset.dlatt);
      if (att) downloadAttachment(att);
    });
  });
  dlg.querySelectorAll("[data-delatt]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const att = state.attachments.find(a=>a.id===btn.dataset.delatt);
      if (att){ await deleteAttachment(att); openReportDialog(reportId); }
    });
  });
  const btnAddAtt = dlg.querySelector("#btnAddAtt");
  if (btnAddAtt){
    btnAddAtt.addEventListener("click", async ()=>{
      const file = dlg.querySelector("#attFile").files[0];
      const cat = dlg.querySelector("#attCategory").value;
      if (!file){ alert("Choisissez un fichier à joindre."); return; }
      btnAddAtt.disabled = true; btnAddAtt.textContent = "Envoi...";
      await saveAttachment(reportId, cat, file);
      openReportDialog(reportId);
    });
  }

  DOMAINES.forEach(dom=>{
    const btn = dlg.querySelector(`[data-savedom="${dom.id}"]`);
    if (btn){
      btn.addEventListener("click", async ()=>{
        const texte = dlg.querySelector(`#txt-${dom.id}`).value;
        const prio = dlg.querySelector(`#prio-${dom.id}`).value;
        const nbErr = dlg.querySelector(`#nberr-${dom.id}`).value;
        await saveRemark(reportId, dom.id, texte, prio, nbErr);
        openReportDialog(reportId);
      });
    }
  });
  // Réponses des ingénieurs à un round de retour UO (une seule, celle du round courant, est éditable)
  dlg.querySelectorAll("[data-saveretour]").forEach(rbtn=>{
    rbtn.addEventListener("click", async ()=>{
      const domId = rbtn.dataset.saveretour;
      const round = parseInt(rbtn.dataset.round, 10);
      const statutRetour = dlg.querySelector(`#rstatut-${domId}-${round}`).value;
      const commentaire = dlg.querySelector(`#rcomment-${domId}-${round}`).value;
      await saveRetourReponse(reportId, domId, round, statutRetour, commentaire);
      openReportDialog(reportId);
    });
  });

  if (isResponsable){
    dlg.querySelector("#btnGenSynth").addEventListener("click", ()=>{
      const ta = dlg.querySelector("#synthText");
      const generated = buildSyntheseText(reportId);
      if (!generated){
        alert("Aucune remarque n'a encore été saisie par les ingénieurs pour ce rapport.");
        return;
      }
      if (ta.value.trim() && ta.value.trim() !== generated.trim()){
        if (!confirm("Remplacer le texte actuel par le rapport généré automatiquement à partir de toutes les remarques des systèmes ?")) return;
      }
      ta.value = generated;
    });
    dlg.querySelector("#btnSaveDraft").addEventListener("click", async ()=>{
      await saveConsolidation(reportId, dlg.querySelector("#synthText").value, "brouillon");
      openReportDialog(reportId);
    });
    dlg.querySelector("#btnValidate").addEventListener("click", async ()=>{
      await saveConsolidation(reportId, dlg.querySelector("#synthText").value, "valide");
      openReportDialog(reportId);
    });
    const sentBtn = dlg.querySelector("#btnMarkSent");
    if (sentBtn) sentBtn.addEventListener("click", async ()=>{
      await saveConsolidation(reportId, dlg.querySelector("#synthText").value, "envoye");
      openReportDialog(reportId);
    });
    const reopenBtn = dlg.querySelector("#btnReopen");
    if (reopenBtn) reopenBtn.addEventListener("click", async ()=>{
      await saveConsolidation(reportId, dlg.querySelector("#synthText").value, "brouillon");
      openReportDialog(reportId);
    });

    // Enregistrer un round de retour UO existant (le round courant, éditable)
    dlg.querySelectorAll("[data-saveretourround]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const round = parseInt(btn.dataset.saveretourround, 10);
        btn.disabled = true; btn.textContent = "Enregistrement...";
        const texte = dlg.querySelector(`#retourText-${round}`).value;
        const wordFile = dlg.querySelector(`#retourWord-${round}`).files[0];
        const excelFile = dlg.querySelector(`#retourExcel-${round}`).files[0];
        await saveRetourRound(reportId, round, texte);
        if (wordFile) await saveAttachment(reportId, "retour_word", wordFile, round);
        if (excelFile) await saveAttachment(reportId, "retour_excel", excelFile, round);
        openReportDialog(reportId);
      });
    });
    // Créer un nouveau round de retour UO
    const btnSaveNewRound = dlg.querySelector("#btnSaveNewRound");
    if (btnSaveNewRound) btnSaveNewRound.addEventListener("click", async ()=>{
      btnSaveNewRound.disabled = true; btnSaveNewRound.textContent = "Enregistrement...";
      const texte = dlg.querySelector("#retourText-new").value;
      if (!texte || !texte.trim()){ alert("Merci de saisir le texte du retour de l'UO."); btnSaveNewRound.disabled=false; btnSaveNewRound.textContent="Enregistrer"; return; }
      const wordFile = dlg.querySelector("#retourWord-new").files[0];
      const excelFile = dlg.querySelector("#retourExcel-new").files[0];
      const nextRound = roundsFor(reportId).length + 1;
      await saveRetourRound(reportId, nextRound, texte);
      if (wordFile) await saveAttachment(reportId, "retour_word", wordFile, nextRound);
      if (excelFile) await saveAttachment(reportId, "retour_excel", excelFile, nextRound);
      const reportForMail = state.reports.find(r=>r.id === reportId);
      if (reportForMail) notifierIngenieursRetourUO(reportForMail, nextRound);
      openReportDialog(reportId);
    });
    // Synthèse de réponse par round
    dlg.querySelectorAll("[data-genretoursynth]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const round = parseInt(btn.dataset.genretoursynth, 10);
        const ta = dlg.querySelector(`#retourSynthText-${round}`);
        const generated = buildRetourSyntheseText(reportId, round);
        if (!generated){
          alert("Aucun ingénieur n'a encore répondu à ce round de retour (Validé / En cours).");
          return;
        }
        if (ta.value.trim() && ta.value.trim() !== generated.trim()){
          if (!confirm("Remplacer le texte actuel par la réponse générée automatiquement à partir des positions des ingénieurs ?")) return;
        }
        ta.value = generated;
      });
    });
    dlg.querySelectorAll("[data-saveretoursynth]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const round = parseInt(btn.dataset.saveretoursynth, 10);
        await saveRetourSynthese(reportId, round, dlg.querySelector(`#retourSynthText-${round}`).value, "brouillon");
        openReportDialog(reportId);
      });
    });
    // Le responsable valide la synthèse de réponse au retour UO (avant envoi).
    dlg.querySelectorAll("[data-validateretoursynth]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const round = parseInt(btn.dataset.validateretoursynth, 10);
        const texte = dlg.querySelector(`#retourSynthText-${round}`).value;
        if (!texte || !texte.trim()){ alert("La synthèse de réponse est vide. Merci de la rédiger avant de valider."); return; }
        await saveRetourSynthese(reportId, round, texte, "valide");
        openReportDialog(reportId);
      });
    });
    // Le responsable marque la synthèse comme envoyée à l'UO (une fois validée), à l'image de l'analyse initiale.
    dlg.querySelectorAll("[data-sendretoursynth]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const round = parseInt(btn.dataset.sendretoursynth, 10);
        const texte = dlg.querySelector(`#retourSynthText-${round}`) ? dlg.querySelector(`#retourSynthText-${round}`).value : "";
        await saveRetourSynthese(reportId, round, texte, "envoye");
        openReportDialog(reportId);
      });
    });
    // Réouverture (retour à brouillon) en cas d'erreur avant l'envoi effectif.
    dlg.querySelectorAll("[data-reopenretoursynth]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const round = parseInt(btn.dataset.reopenretoursynth, 10);
        const texte = dlg.querySelector(`#retourSynthText-${round}`) ? dlg.querySelector(`#retourSynthText-${round}`).value : (roundsFor(reportId).find(r=>r.round===round)||{}).syntheseReponse || "";
        await saveRetourSynthese(reportId, round, texte, "brouillon");
        openReportDialog(reportId);
      });
    });
    dlg.querySelectorAll("[data-copyretoursynth]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const round = parseInt(btn.dataset.copyretoursynth, 10);
        const texte = dlg.querySelector(`#retourSynthText-${round}`).value;
        const emailText = `Réponse au retour UO — ${report.uo} — ${fmtPeriode(report.periode, report.type)}${roundsFor(reportId).length>1 ? " (Round "+round+")" : ""}\nDate: ${new Date().toLocaleDateString("fr-FR")}\n\n${texte}\n\n---\nRédigé par: ${displayName(roleObj())}`;
        navigator.clipboard.writeText(emailText).then(()=>{
          const original = btn.textContent;
          btn.textContent = "✓ Copié !";
          setTimeout(()=> btn.textContent = original, 1500);
        });
      });
    });
  }

  dlg.querySelector("#btnCopy").addEventListener("click", ()=>{
    const finalConsol = consolFor(reportId);
    const texte = finalConsol ? finalConsol.texte : draftDefault;
    const emailText = `Consolidation — Rapport d'activité ${report.uo} — ${fmtPeriode(report.periode, report.type)}\nDate: ${new Date().toLocaleDateString("fr-FR")}\n\n${texte}\n\n---\nRédigé par: ${finalConsol ? finalConsol.responsable : displayName(roleObj())}`;
    navigator.clipboard.writeText(emailText).then(()=>{
      const btn = dlg.querySelector("#btnCopy");
      const original = btn.textContent;
      btn.textContent = "✓ Copié !";
      setTimeout(()=> btn.textContent = original, 1500);
    });
  });

  dlg.showModal();
}
function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* =========================================================
   MAIN RENDER
   ========================================================= */
function render(){
  renderRoleChip();
  if (!state.role){
    renderRoleScreen();
    document.getElementById("footerTip").textContent = "";
    return;
  }
  const app = document.getElementById("app");
  app.innerHTML = `
    ${renderConnectionBanner()}
    ${state.connected ? renderTraitementBanner() : ""}
    ${state.connected ? renderEnvoiBanner() : ""}
    ${state.connected ? renderStats() : ""}
    ${state.connected ? renderMoyenneErreursParUO() : ""}
    ${state.connected ? renderFilterBar() : ""}
    ${state.connected ? renderTable() : ""}
  `;
  bindConnectionBanner();
  if (state.connected){
    bindNotifBanners();
    bindFilterBar();
    bindTable();
  }
  document.getElementById("footerTip").textContent =
    "Astuce : gardez ce fichier HTML et son dossier de données sur le même serveur partagé. Chaque personne l'ouvre depuis son poste et se connecte au même dossier de données.";
  maybeOpenPendingReportFromLink();
}

/* Si l'appli a été ouverte via un lien email (?report=ID), on ouvre
   automatiquement la fiche du rapport concerné, une seule fois. */
function maybeOpenPendingReportFromLink(){
  if (!state.pendingOpenReportId || !state.connected || !state.role) return;
  const rid = state.pendingOpenReportId;
  const exists = state.reports.some(r=>r.id===rid);
  if (!exists) return; // rapport pas encore chargé ou id invalide : on réessaiera au prochain render
  state.pendingOpenReportId = null;
  openReportDialog(rid);
}

/* =========================================================
   INIT
   ========================================================= */
(async function init(){
  const savedRole = localStorage.getItem("suivi-uo-role");
  if (savedRole && ROLES.some(r=>r.id===savedRole)) state.role = savedRole;
  render();
  if (fsSupported){
    await tryReconnect();
    render();
  }
})();
</script>
</body>
</html>
